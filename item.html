<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f5"><title>项目详情 · 接单价目表</title><style>:root{--bg:#f8f7f5;--line:#e4e0db;--muted:#777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#242424;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:950px;margin:auto;padding:0 22px 90px}header{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:24px 0;font-size:13px}a{color:inherit}header a{text-decoration:none;color:#666}.hero{padding:78px 0 40px}.eyebrow{font-size:11px;color:#999;letter-spacing:.2em}.hero h1{font-size:clamp(34px,6vw,62px);margin:18px 0}.hero p{font-size:14px;line-height:2;color:#777;max-width:700px}.head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #d8d4cf;margin:45px 0 20px;padding-bottom:15px}.head h2{font-size:22px;margin:0}.head small{font-size:11px;color:#999}.panel{background:#fff;border:1px solid var(--line);padding:28px}.panel p{font-size:13px;color:#777;line-height:2;margin:0}.price{font-size:28px;font-weight:700}.status{font-size:12px;color:#888;margin-top:8px}.empty{color:#999;font-size:13px;line-height:2}.footer{margin-top:65px;border-top:1px solid var(--line);padding-top:24px;color:#aaa;font-size:11px}@media(max-width:650px){.hero{padding-top:52px}.panel{padding:20px}}</style></head><body><main><header><b>STUDIO / COMMISSION</b><a id="back" href="index.html">← 返回服务总览</a></header><section class="hero"><div class="eyebrow" id="eyebrow">SERVICE DETAIL</div><h1 id="name">项目详情</h1><p id="description"></p></section><section><div class="head"><h2>01 / 服务价格</h2><small>PRICE</small></div><div class="panel"><div class="price" id="price">价格待定</div><div class="status" id="priceNote"></div></div></section><section><div class="head"><h2>02 / 委托说明</h2><small>ORDER NOTES</small></div><div class="panel"><p id="notes">具体要求、交付形式、工期及修改规则待确认。</p></div></section><section><div class="head"><h2>03 / 作品案例</h2><small>PORTFOLIO</small></div><div class="panel"><p class="empty">此项目的案例图片尚未添加。后续补充后将在此展示。</p></div></section><div class="footer">COMMISSION PORTFOLIO</div></main><script>const q=new URLSearchParams(location.search),slug=q.get('type')||'zepeto',idx=Number(q.get('item'));fetch('services.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const group=data.find(x=>x.slug===slug),item=group&&group.items&&group.items[idx];if(!item||!Number.isInteger(idx)||idx<0){document.getElementById('name').textContent='未找到项目';return}document.title=item.name+' · 接单价目表';document.getElementById('name').textContent=item.name;document.getElementById('description').textContent=item.description||'';document.getElementById('eyebrow').textContent=group.name+' / SERVICE DETAIL';document.getElementById('back').href='service.html?type='+encodeURIComponent(slug);document.getElementById('price').textContent=item.price||'价格待定';document.getElementById('priceNote').textContent=(item.price||'价格待定')==='价格待定'?'尚未公布正式价格，请勿以此页面作为报价依据。':'';document.getElementById('notes').textContent=item.notes||'具体要求、交付形式、工期及修改规则尚未最终确定，请在委托前确认。'}).catch(()=>document.getElementById('name').textContent='页面数据暂时无法加载');</script></body></html>
