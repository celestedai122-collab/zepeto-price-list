<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f5"><title>接单价目表 · COMMISSION SERVICES</title><style>:root{--bg:#f8f7f5;--line:#e6e2dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#242424;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:0 22px 90px}header{display:flex;justify-content:space-between;gap:16px;padding:24px 0;border-bottom:1px solid var(--line);font-size:13px}a{color:inherit}header a{text-decoration:none;color:#666}.hero{padding:75px 0 40px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#999}.hero h1{font-size:clamp(36px,6vw,64px);margin:16px 0}.hero p{font-size:14px;color:#777;line-height:2}.head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #d8d4cf;padding-bottom:16px;margin:48px 0 23px;gap:12px}.head h2{font-size:23px;margin:0}.head small{color:#999;font-size:11px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:14px;min-height:190px;text-decoration:none;transition:border-color .2s}.card:hover{border-color:#888}.card h3{font-size:19px;margin:0}.card p{font-size:12px;color:#777;line-height:1.9;margin:0}.card .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;gap:10px}.card strong{font-size:18px}.card .arrow{font-size:18px;color:#777}.notice{background:#fff;border:1px solid var(--line);padding:24px;color:#777;font-size:13px;line-height:2}.notice p{margin:0 0 8px}.notice p:last-child{margin:0}.footer{margin-top:65px;padding-top:22px;border-top:1px solid var(--line);font-size:11px;color:#aaa}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.cards{grid-template-columns:1fr}.hero{padding-top:50px}.head h2{font-size:20px}}</style></head><body><main><header><b>STUDIO / COMMISSION</b><span style="color:#888">COMMISSION DIRECTORY</span></header><section class="hero"><div class="eyebrow">COMMISSION SERVICES / 2026</div><h1>接单范围</h1><p>选择服务类别，查看价格、委托说明及作品案例。尚未公布价格的项目将在确认后更新。</p></section><div id="sections"></div><section><div class="head"><h2>04 / 通用接单须知</h2><small>GENERAL ORDER NOTES</small></div><div class="notice" id="generalNotes">更多接单须知将陆续补充，具体条款以各项目详情页为准。</div></section><div class="footer">COMMISSION SERVICES</div></main><script>const categories=[{slug:'zepeto',label:'ZEPETO 相关',subtitle:'FACE / STYLING / CREATIVE'},{slug:'modeling',label:'建模',subtitle:'3D MODELING'},{slug:'writing',label:'文稿',subtitle:'WRITING'}];fetch('services.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const root=document.getElementById('sections');categories.forEach((c,i)=>{const d=data.find(x=>x.slug===c.slug);if(!d)return;const section=document.createElement('section'),head=document.createElement('div');head.className='head';const title=document.createElement('h2');title.textContent=String(i+1).padStart(2,'0')+' / '+c.label;const small=document.createElement('small');small.textContent=c.subtitle;head.append(title,small);const cards=document.createElement('div');cards.className='cards';(d.items||[]).forEach((item,j)=>{if(c.slug==='zepeto'&&j>0&&j<4)return;const a=document.createElement('a');a.className='card';a.href=c.slug==='zepeto'&&j===0?'z01.html':c.slug==='zepeto'&&j===4?'z02.html':'item.html?type='+encodeURIComponent(c.slug)+'&item='+j;const h=document.createElement('h3');h.textContent=c.slug==='zepeto'&&j===0?'捏脸服务（四项）':item.name;const p=document.createElement('p');p.textContent=c.slug==='zepeto'&&j===0?'定制捏脸（自带妆容穿搭）¥7 / 定制捏脸（帮找妆容穿搭）¥9 / 盲盒捏脸 ¥5 / 脸型微调 ¥3':item.description||'详情与委托要求将陆续补充';const foot=document.createElement('div');foot.className='bottom';const price=document.createElement('strong');price.textContent=c.slug==='zepeto'&&j===0?'¥3–¥9':item.price||'价格待定';const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';foot.append(price,arrow);a.append(h,p,foot);cards.append(a)});section.append(head,cards);root.append(section)})}).catch(()=>document.getElementById('sections').textContent='服务目录暂时无法加载，请稍后刷新。');</script></body></html>
