<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f5"><title>ZEPETO · 接单价目表</title><style>
:root{--bg:#f8f7f5;--ink:#232323;--muted:#7b7976;--line:#e6e2dd}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:0 22px 90px}header{border-bottom:1px solid var(--line);padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}header b{letter-spacing:.15em;font-size:14px}header a{font-size:12px;color:#555;text-decoration:none}.hero{padding:80px 0 56px}.eyebrow{font-size:11px;letter-spacing:.22em;color:#888}.hero h1{font-size:clamp(34px,6vw,66px);letter-spacing:-.05em;margin:16px 0}.hero p{color:#777;line-height:1.9;font-size:14px;max-width:650px}.meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.meta span{border:1px solid var(--line);padding:9px 14px;border-radius:30px;font-size:12px;color:#777}.section-title{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #d7d3ce;padding-bottom:15px;margin:50px 0 25px;gap:12px}.section-title h2{margin:0;font-size:23px}.section-title small{color:#888}.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.rate{border:1px solid var(--line);background:#fff;padding:20px;min-height:110px}.rate b{font-size:14px}.rate strong{display:block;font-size:25px;margin-top:12px}.rate p{font-size:12px;color:#8a8783;line-height:1.7;margin-bottom:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.tab{cursor:pointer;background:transparent;border:1px solid #dedbd6;border-radius:20px;padding:10px 15px;font-size:12px;color:#555}.tab.active{background:#252525;color:#fff;border-color:#252525}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.work{margin:0}.work img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee;display:block;border-radius:3px}.work figcaption{font-size:11px;color:#888;margin-top:8px}.note{padding:24px;border:1px solid var(--line);background:#fff;color:#777;line-height:1.9;font-size:13px}.footer{margin-top:70px;border-top:1px solid var(--line);padding-top:24px;color:#aaa;font-size:11px}@media(max-width:850px){.rates{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.hero{padding:55px 0 30px}.gallery{grid-template-columns:repeat(2,1fr);gap:10px}.rate{padding:15px}.section-title h2{font-size:20px}}@media(max-width:380px){.rates{grid-template-columns:1fr}}
</style></head><body><main><header><b>STUDIO / ZEPETO</b><a href="#gallery">查看作品 ↓</a></header><section class="hero"><div class="eyebrow">COMMISSION MENU / 2026</div><h1 id="siteTitle">接单价目表<span style="color:#aaa">.</span></h1><p id="intro"></p><div class="meta"><span>3D / 2D</span><span>按风格浏览</span><span>手机端适配</span></div></section><section id="price"><div class="section-title"><h2>01 / 捏脸服务</h2><small>PRICE GUIDE</small></div><div class="rates" id="prices"></div></section><section id="gallery"><div class="section-title"><h2>02 / 作品展示</h2><small id="count"></small></div><div class="tabs" id="tabs"></div><div class="gallery" id="grid"></div></section><section><div class="section-title"><h2>03 / 其他接单范围</h2><small>COMING SOON</small></div><div class="rates" id="services"></div></section><section><div class="section-title"><h2>04 / 下单须知</h2></div><div class="note" id="rules"></div></section><div class="footer">ZEPETO COMMISSION PORTFOLIO</div></main><script>
const el=id=>document.getElementById(id);
function add(tag,parent,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;parent.append(e);return e}
fetch('content.json?v=20261025-3',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{el('siteTitle').textContent=d.siteTitle||'接单价目表';el('intro').textContent=d.intro||'';(d.prices||[]).forEach(x=>{const c=add('div',el('prices'),'rate');add('b',c,'',x.name);add('strong',c,'',x.price);add('p',c,'',x.detail||'')});(d.services||[]).forEach(x=>{const c=add('div',el('services'),'rate');add('b',c,'',x.name);add('p',c,'',x.detail||'')});(d.rules||[]).forEach(x=>add('p',el('rules'),'',x))}).catch(()=>{el('prices').textContent='价格信息暂时无法加载，请稍后刷新。'});
fetch('gallery.json?v=20261025-3',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const cats=['全部',...new Set(data.map(x=>x.category))];const tabs=el('tabs'),grid=el('grid'),count=el('count');function render(cat){tabs.innerHTML='';cats.forEach(c=>{let b=document.createElement('button');b.className='tab'+(c===cat?' active':'');b.textContent=c;b.onclick=()=>render(c);tabs.append(b)});let items=cat==='全部'?data:data.filter(x=>x.category===cat);count.textContent=items.length+' 件作品';grid.innerHTML='';items.forEach((x,i)=>{let f=document.createElement('figure');f.className='work';let im=document.createElement('img');im.src=x.image;im.loading=i<4?'eager':'lazy';im.alt=x.category+' 作品案例';let cap=document.createElement('figcaption');cap.textContent=x.category;f.append(im,cap);grid.append(f)})}render('全部')}).catch(()=>{el('grid').textContent='作品读取失败，请稍后刷新。'});
</script></body></html>
