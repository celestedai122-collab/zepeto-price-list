<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f5"><title>服务详情 · 接单价目表</title>
<style>:root{--bg:#f8f7f5;--ink:#232323;--muted:#777;--line:#e6e2dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:0 22px 90px}header{padding:22px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}header b{letter-spacing:.12em;font-size:14px}a{color:inherit}header a{font-size:12px;text-decoration:none}.hero{padding:74px 0 48px}.eyebrow{color:#999;font-size:11px;letter-spacing:.2em}.hero h1{font-size:clamp(36px,6vw,64px);margin:15px 0}.hero p{color:#777;line-height:1.9;max-width:640px;font-size:14px}.section{margin:30px 0 55px}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid #d7d3ce;padding-bottom:15px;margin-bottom:22px}.section-head h2{font-size:23px;margin:0}.section-head small{color:#999}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{background:#fff;border:1px solid var(--line);padding:24px;min-height:165px;display:flex;flex-direction:column;gap:14px}.item h3{font-size:17px;margin:0}.item p{font-size:12px;color:#777;line-height:1.9;margin:0}.item strong{font-size:18px;margin-top:auto}.muted{color:#999;font-size:12px}.note{background:#fff;border:1px solid var(--line);padding:24px;font-size:13px;color:#777;line-height:2}.footer{margin-top:65px;border-top:1px solid var(--line);padding-top:22px;color:#aaa;font-size:11px}@media(max-width:800px){.items{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.hero{padding:52px 0 35px}.items{grid-template-columns:1fr}.section-head h2{font-size:20px}}</style></head>
<body><main><header><b>STUDIO / COMMISSION</b><a href="index.html">← 返回总览</a></header><section class="hero"><div class="eyebrow">SERVICE DETAILS / 2026</div><h1 id="title">服务详情</h1><p id="description"></p></section><section class="section"><div class="section-head"><h2>01 / 接单项目</h2><small id="total"></small></div><div class="items" id="items"></div></section><section class="section"><div class="section-head"><h2>02 / 接单说明</h2><small>ORDER NOTES</small></div><div class="note" id="notes">具体要求、交付形式及工期请在下单前沟通确认。</div></section><div class="footer">COMMISSION PORTFOLIO · <a href="index.html">返回首页</a></div></main>
<script>const slug=new URLSearchParams(location.search).get('type')||'zepeto';fetch('services.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(data=>{const d=data.find(x=>x.slug===slug);if(!d){document.getElementById('title').textContent='未找到该服务';return}document.title=d.name+' · 接单价目表';document.getElementById('title').textContent=d.name;document.getElementById('description').textContent=d.description||'';document.getElementById('total').textContent=(d.items||[]).length+' 项服务';document.getElementById('notes').textContent=d.notes||'具体要求、交付形式及工期请在下单前沟通确认。';for(const x of d.items||[]){const c=document.createElement('article');c.className='item';const t=document.createElement('h3');t.textContent=x.name;const p=document.createElement('p');p.textContent=x.description||'具体需求可咨询';const price=document.createElement('strong');price.textContent=x.price||'价格待定';c.append(t,p,price);document.getElementById('items').append(c)}}).catch(()=>document.getElementById('description').textContent='服务信息暂时无法加载，请稍后重试。');</script></body></html>
